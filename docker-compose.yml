version: '3.8'

services:
  # --- DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: scaffold-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- MESSAGING OPTION A: RabbitMQ ---
  # Ideal for traditional queuing (e.g., Ticket Sale project)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: scaffold-rabbit
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MESSAGING OPTION B: Kafka + Zookeeper ---
  # Ideal for high-throughput data streams (e.g., Stock Monitor project)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: scaffold-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: scaffold-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --- MONITORING ---
  prometheus:
    image: prom/prometheus:latest
    container_name: scaffold-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: scaffold-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  postgres_data: